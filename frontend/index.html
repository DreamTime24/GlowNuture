<!-- ============================================================
     SECURITY LAYER
     ------------------------------------------------------------
     The Content-Security-Policy below is applied via <meta> for
     defence-in-depth. For full coverage, also send the following
     as HTTP response headers on your web server / CDN:

       Content-Security-Policy: <same policy, tightened>
       Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
       X-Content-Type-Options: nosniff
       X-Frame-Options: DENY
       Referrer-Policy: strict-origin-when-cross-origin
       Permissions-Policy: geolocation=(), microphone=(), camera=(),
                           payment=(), usb=(), magnetometer=(),
                           gyroscope=(), accelerometer=()
       Cross-Origin-Opener-Policy: same-origin
       Cross-Origin-Resource-Policy: same-origin
       Cross-Origin-Embedder-Policy: require-corp

     CSP notes:
       * 'unsafe-inline' for scripts is kept because legacy paths may
         use inline handlers. Remove once the external JS is verified
         to avoid inline event attributes.
       * 'unsafe-inline' for styles is kept because several UI
         components inject styles at runtime. Replace with hashes or
         nonces when possible.
       * 'unsafe-eval' is intentionally NOT allowed. If a dependency
         needs it, isolate it inside a sandboxed worker instead.
       * frame-src allows Firebase auth popups and Google sign-in.
     ============================================================ -->
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com data:;
  img-src 'self' data: blob: https:;
  media-src 'self' https:;
  connect-src 'self' https: wss:;
  worker-src 'self' blob:;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;
  object-src 'none';
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self';
" />
