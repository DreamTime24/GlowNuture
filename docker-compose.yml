# Local PostgreSQL stack. No public/cloud deployment is performed.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: glownuture
      POSTGRES_USER: glownuture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password before running Compose}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U glownuture -d glownuture"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://glownuture:${POSTGRES_PASSWORD}@db:5432/glownuture
      AUTO_CREATE_SCHEMA: "false"
    command: ["alembic","upgrade","head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://glownuture:${POSTGRES_PASSWORD}@db:5432/glownuture
      AUTO_CREATE_SCHEMA: "false"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/opt/glow/frontend/media
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://glownuture:${POSTGRES_PASSWORD}@db:5432/glownuture
    command: ["python","-m","app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  catalog-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://glownuture:${POSTGRES_PASSWORD}@db:5432/glownuture
      MEDIA_ROOT: /opt/glow/frontend/media
    command: ["python","-m","app.catalog_worker"]
    volumes:
      - media:/opt/glow/frontend/media
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
