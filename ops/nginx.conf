# Prepared for glownuture.com on an OWNER-APPROVED ASGI-capable server.
# Obtain a certificate covering glownuture.com AND www.glownuture.com before enabling TLS.
server {
    listen 80;
    server_name glownuture.com www.glownuture.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://glownuture.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.glownuture.com;
    ssl_certificate /etc/letsencrypt/live/glownuture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glownuture.com/privkey.pem;
    return 308 https://glownuture.com$request_uri;
}
server {
    listen 443 ssl;
    server_name glownuture.com;
    ssl_certificate /etc/letsencrypt/live/glownuture.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glownuture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
    }
    location /api/realtime/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    # Managed media is authorized by FastAPI. Do not add a public alias to MEDIA_ROOT.
}
