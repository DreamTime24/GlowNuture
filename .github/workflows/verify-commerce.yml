name: Verify GlowNuture infrastructure and commerce
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: glownuture_test
          POSTGRES_PASSWORD: offline-fixture-password
          POSTGRES_DB: glownuture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glownuture_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m unittest discover -s tests -p "test_infrastructure.py" -v
      - run: python -m unittest discover -s tests -p "test_client*.py" -v
      - run: python scripts/build_firebase_preview.py
      - run: python scripts/doctor.py --mode firebase-preview
      - run: npm ci --ignore-scripts
      - run: npm run check:frontend
      - run: node --check frontend/collection/collection.js
      - run: npm run test:frontend
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://glownuture_test:offline-fixture-password@127.0.0.1:5432/glownuture_test
      - run: python scripts/setup_local.py
      - run: python scripts/doctor.py --mode local
      - run: python -m alembic upgrade head && python -m alembic check
        working-directory: backend
